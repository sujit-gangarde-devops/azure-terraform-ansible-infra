---
tomcat_version: "10.1.34"
tomcat_user: tomcat
tomcat_base_dir: /opt
tomcat_home: /opt/tomcat
tomcat_heap: 256m
tomcat_java_package: openjdk-17-jre-headless
tomcat_java_home: /usr/lib/jvm/java-17-openjdk-amd64
tomcat_download_url: "https://archive.apache.org/dist/tomcat/tomcat-10/v{{ tomcat_version }}/bin/apache-tomcat-{{ tomcat_version }}.tar.gz"
# Default apps that should never be exposed in production
tomcat_remove_webapps:
  - docs
  - examples
  - manager
  - host-manager
